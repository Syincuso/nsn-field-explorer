# Builds and tests the extension on every push and pull request.
# Windows, because the tests compare layout in pixels and were written against Chrome's Windows fonts.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (the extension copy must match the source)
        run: |
          node tools/build.js
          git diff --exit-code
      - run: npm test
